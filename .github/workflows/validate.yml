name: Syntax checks
on:
  pull_request:
  push:
    branches:
      - feature/ukr-v116-security-manager-portfolio
jobs:
  php-and-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.1+ syntax
        run: |
          find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: |
          find wp-content -name '*.js' -print0 | xargs -0 -n1 node --check
